<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../NexoEdu/css/geral.css">
    <link rel="stylesheet" href="../NexoEdu/css/cadastro.css">
</head>
<body>
    <form id="formCadastro">

    <input id="nome" placeholder="Nome completo">

    <input
        type="email"
        id="email"
        placeholder="E-mail"
    >

    <input
        type="password"
        id="senha"
        placeholder="Senha"
    >

    <input
        type="password"
        id="confirmarSenha"
        placeholder="Confirmar senha"
    >

    <button type="submit">
        Criar conta
    </button>

</form>
<script src="../NexoEdu/js/cadastro.js"></script>
</body>
</html>
